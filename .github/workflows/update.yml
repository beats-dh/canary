name: Update vcpkg Baseline

on:
  schedule:
    # Executa diariamente às 2h UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Permite execução manual

permissions:
  contents: write
  pull-requests: write

jobs:
  update-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest vcpkg baseline from release tag
        id: vcpkg-latest
        run: |
          # Pega a tag da release mais recente do vcpkg
          LATEST_TAG=$(curl -s https://api.github.com/repos/microsoft/vcpkg/releases/latest | jq -r '.tag_name')
          echo "Latest release tag: $LATEST_TAG"
          
          # Pega o commit SHA dessa tag
          LATEST_BASELINE=$(curl -s https://api.github.com/repos/microsoft/vcpkg/git/ref/tags/$LATEST_TAG | jq -r '.object.sha')
          echo "baseline=$LATEST_BASELINE" >> $GITHUB_OUTPUT
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest vcpkg baseline from release $LATEST_TAG: $LATEST_BASELINE"

      - name: Get current baseline
        id: current-baseline
        run: |
          CURRENT_BASELINE=$(jq -r '."builtin-baseline"' vcpkg.json)
          echo "baseline=$CURRENT_BASELINE" >> $GITHUB_OUTPUT
          echo "Current baseline: $CURRENT_BASELINE"

      - name: Check if update needed
        id: check-update
        run: |
          if [ "${{ steps.vcpkg-latest.outputs.baseline }}" != "${{ steps.current-baseline.outputs.baseline }}" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "Update needed"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Already up to date"
          fi

      - name: Update vcpkg.json on main branch
        if: steps.check-update.outputs.needs_update == 'true' && github.ref == 'refs/heads/main'
        run: |
          # Cria uma nova branch para o PR
          BRANCH_NAME="chore/update-vcpkg-baseline-${{ steps.vcpkg-latest.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH_NAME

          # Atualiza o baseline no vcpkg.json
          jq --arg baseline "${{ steps.vcpkg-latest.outputs.baseline }}" \
            '."builtin-baseline" = $baseline' vcpkg.json > vcpkg.json.tmp
          mv vcpkg.json.tmp vcpkg.json

          # Commit e push
          git add vcpkg.json
          git commit -m "chore: update vcpkg baseline to ${{ steps.vcpkg-latest.outputs.tag }} (${{ steps.vcpkg-latest.outputs.baseline }})"
          git push origin $BRANCH_NAME

          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create Pull Request on main
        if: steps.check-update.outputs.needs_update == 'true' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH_NAME }}
          title: "chore: Update vcpkg baseline to ${{ steps.vcpkg-latest.outputs.tag }}"
          body: |
            ## vcpkg Baseline Update
            
            This PR updates the vcpkg `builtin-baseline` to the latest release version.
            
            **Release:** `${{ steps.vcpkg-latest.outputs.tag }}`
            **Previous baseline:** `${{ steps.current-baseline.outputs.baseline }}`
            **New baseline:** `${{ steps.vcpkg-latest.outputs.baseline }}`
            
            **Release notes:** https://github.com/microsoft/vcpkg/releases/tag/${{ steps.vcpkg-latest.outputs.tag }}
            **Changes:** [Compare versions](https://github.com/microsoft/vcpkg/compare/${{ steps.current-baseline.outputs.baseline }}...${{ steps.vcpkg-latest.outputs.baseline }})
            
            ---
            🤖 This PR was automatically generated by GitHub Actions
          labels: dependencies, vcpkg, automated

  update-prs:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest vcpkg baseline from release tag
        id: vcpkg-latest
        run: |
          # Pega a tag da release mais recente do vcpkg
          LATEST_TAG=$(curl -s https://api.github.com/repos/microsoft/vcpkg/releases/latest | jq -r '.tag_name')
          echo "Latest release tag: $LATEST_TAG"
          
          # Pega o commit SHA dessa tag
          LATEST_BASELINE=$(curl -s https://api.github.com/repos/microsoft/vcpkg/git/ref/tags/$LATEST_TAG | jq -r '.object.sha')
          echo "baseline=$LATEST_BASELINE" >> $GITHUB_OUTPUT
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest vcpkg baseline from release $LATEST_TAG: $LATEST_BASELINE"

      - name: Get open PRs
        id: get-prs
        run: |
          # Lista todos os PRs abertos
          gh pr list --json number,headRefName --jq '.[] | "\(.number):\(.headRefName)"' > prs.txt
          echo "Found PRs:"
          cat prs.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PRs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          while IFS=: read -r pr_number branch_name; do
            echo "Processing PR #$pr_number (branch: $branch_name)"
            
            # Checkout da branch do PR
            git fetch origin $branch_name
            git checkout $branch_name
            
            # Verifica se vcpkg.json existe
            if [ ! -f "vcpkg.json" ]; then
              echo "vcpkg.json not found in PR #$pr_number, skipping"
              continue
            fi
            
            # Pega o baseline atual
            CURRENT_BASELINE=$(jq -r '."builtin-baseline"' vcpkg.json)
            
            # Verifica se precisa atualizar
            if [ "$CURRENT_BASELINE" != "${{ steps.vcpkg-latest.outputs.baseline }}" ]; then
              echo "Updating baseline in PR #$pr_number"
              
              # Atualiza o baseline
              jq --arg baseline "${{ steps.vcpkg-latest.outputs.baseline }}" \
                '."builtin-baseline" = $baseline' vcpkg.json > vcpkg.json.tmp
              mv vcpkg.json.tmp vcpkg.json
              
              # Commit e push
              git add vcpkg.json
              git commit -m "chore: update vcpkg baseline to ${{ steps.vcpkg-latest.outputs.tag }} (${{ steps.vcpkg-latest.outputs.baseline }})"
              git push origin $branch_name
              
              # Adiciona comentário no PR
              gh pr comment $pr_number --body "✅ vcpkg baseline updated to release \`${{ steps.vcpkg-latest.outputs.tag }}\` (\`${{ steps.vcpkg-latest.outputs.baseline }}\`)"
            else
              echo "PR #$pr_number already has the latest baseline"
            fi
          done < prs.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
